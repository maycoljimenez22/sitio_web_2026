<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mi Sitio Git</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <h1>Bienvenido a mi sitio</h1>
        <p>Proyecto para aprender Git y GitHub</p>
    </header>

    <section class="cards">
        <div class="card">
            <img src="images/img1.png" alt="img1">
            <h2>HTML</h2>
            <p>Estructura del sitio</p>
        </div>
        <div class="card">
            <img src="images/img2.png" alt="img2">
            <h2>CSS</h2>
            <p>Estilos modernos</p>
        </div>
        <div class="card">
            <img src="images/img3.png" alt="img3">
            <h2>JavaScript</h2>
            <p>Interactividad</p>
        </div>
    </section>

    <button onclick="saludar()">Haz clic</button>

    <script src="js/app.js"></script>
</body>
</html>
